name: Release

on:
  push:
    tags:
      - "v*"
      - "release/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g. 1.1). Leave empty to build an existing tag."
        required: false
      version_code:
        description: "versionCode (optional; auto-increments when empty)"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  INPUT_VERSION: ${{ github.event.inputs.version }}
  INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDK_MGR=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDK_MGR" --licenses || true
          "$SDK_MGR" --install "platforms;android-37.0" "platforms;android-37.1" "build-tools;37.0.0" "platform-tools"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Resolve version and tag
        id: ver
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            v="${INPUT_VERSION#v}"
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
            echo "bump=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == release/v* ]]; then
            v="${GITHUB_REF_NAME#release/v}"
            v="${v#v}"
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            tag="$GITHUB_REF_NAME"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and push tag
        if: steps.ver.outputs.bump == 'true'
        run: |
          set -e
          f=app/build.gradle.kts
          tag="${{ steps.ver.outputs.tag }}"
          newv="${{ steps.ver.outputs.version }}"

          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi

          if [ -n "$INPUT_VERSION_CODE" ]; then
            newc="$INPUT_VERSION_CODE"
          else
            cur=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$f")
            newc=$((cur + 1))
          fi

          sed -i -E "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = $newc/" "$f"
          sed -i -E "s/versionName[[:space:]]*=[[:space:]]*\"[^\"]*\"/versionName = \"$newv\"/" "$f"

          echo "Bumping to versionName=$newv versionCode=$newc"
          git diff -- "$f"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "Release $tag"
          src_sha=$(git rev-parse HEAD)
          git tag "$tag"

          meta=fdroid/adb.captain.yml
          if [ -f "$meta" ]; then
            sed -i -E "s/^  - versionName: .*/  - versionName: '$newv'/" "$meta"
            sed -i -E "s/^    versionCode: .*/    versionCode: $newc/" "$meta"
            sed -i -E "s/^    commit: .*/    commit: $src_sha/" "$meta"
            sed -i -E "s/^CurrentVersion: .*/CurrentVersion: '$newv'/" "$meta"
            sed -i -E "s/^CurrentVersionCode: .*/CurrentVersionCode: $newc/" "$meta"
            git add "$meta"
            git commit -m "Sync F-Droid metadata for $tag"
          fi

          git push origin HEAD:main
          git push origin "$tag"

      - name: Grant gradlew permissions
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.jks
          echo "storeFile=keystore/release.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEYSTORE_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> keystore.properties

      - name: Build signed release APK
        run: ./gradlew :app:assembleFdroidRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/fdroid/release/app-fdroid-release.apk \
             app/build/outputs/apk/fdroid/release/adb-captain-${{ steps.ver.outputs.tag }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ADB Captain ${{ steps.ver.outputs.tag }}
          body: |
            **ADB Captain** — rootless ADB toolkit powered by Shizuku.

            ## What's in this release

            - Terminal: run any ADB command (pm, am, dumpsys, settings, input), autocomplete from history
            - Apps: installed packages in one list, user/system separated, safety ratings
            - Devices: model, Android version, battery, connection status, reboot, screenshots
            - Logcat: live system log, filterable by level and text
            - Sideload & tools: install APKs, screen recording, quick toggles, type text, open links

            ## Build

            - Flavor: `fdroid` (pure FOSS, no ads, no analytics, no accounts)
            - Signed with the project release key
            - License: AGPL-3.0-or-later
          files: app/build/outputs/apk/fdroid/release/adb-captain-*.apk
