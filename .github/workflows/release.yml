name: Release

on:
  push:
    tags:
      - "v*"
      - "release/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g. 1.1). Leave empty to build an existing tag."
        required: false
      version_code:
        description: "versionCode (optional; auto-increments when empty)"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  INPUT_VERSION: ${{ github.event.inputs.version }}
  INPUT_VERSION_CODE: ${{ github.event.inputs.version_code }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDK_MGR=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDK_MGR" --licenses || true
          "$SDK_MGR" --install "platforms;android-37.0" "platforms;android-37.1" "build-tools;37.0.0" "platform-tools"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Resolve version and tag
        id: ver
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            v="${INPUT_VERSION#v}"
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
            echo "bump=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == release/v* ]]; then
            v="${GITHUB_REF_NAME#release/v}"
            v="${v#v}"
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            tag="$GITHUB_REF_NAME"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and push tag
        if: steps.ver.outputs.bump == 'true'
        run: |
          set -e
          f=app/build.gradle.kts
          tag="${{ steps.ver.outputs.tag }}"
          newv="${{ steps.ver.outputs.version }}"

          if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi

          if [ -n "$INPUT_VERSION_CODE" ]; then
            newc="$INPUT_VERSION_CODE"
          else
            cur=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' "$f")
            newc=$((cur + 1))
          fi

          sed -i -E "s/versionCode[[:space:]]*=[[:space:]]*[0-9]+/versionCode = $newc/" "$f"
          sed -i -E "s/versionName[[:space:]]*=[[:space:]]*\"[^\"]*\"/versionName = \"$newv\"/" "$f"

          echo "Bumping to versionName=$newv versionCode=$newc"
          git diff -- "$f"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          git commit -m "Release $tag"
          src_sha=$(git rev-parse HEAD)
          git tag "$tag"

          meta=fdroid/adb.captain.yml
          if [ -f "$meta" ]; then
            python3 - "$meta" "$newv" "$newc" "$src_sha" <<'PY'
import re, sys

path, name, code, commit = sys.argv[1:5]
text = open(path, encoding="utf-8").read()
entry = (
    f"\n  - versionName: '{name}'\n"
    f"    versionCode: {code}\n"
    f"    commit: {commit}\n"
    "    subdir: app\n"
    "    gradle:\n"
    "      - fdroid\n"
)
text = text.replace("\nAllowedAPKSigningKeys:", entry + "\nAllowedAPKSigningKeys:", 1)
text = re.sub(r"^CurrentVersion: .*$", f"CurrentVersion: '{name}'", text, flags=re.M)
text = re.sub(r"^CurrentVersionCode: .*$", f"CurrentVersionCode: {code}", text, flags=re.M)
open(path, "w", encoding="utf-8").write(text)
PY
            git add "$meta"
            git commit -m "Sync F-Droid metadata for $tag"
          fi

          git push origin "HEAD:$DEFAULT_BRANCH"
          git push origin "$tag"

      - name: Grant gradlew permissions
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.jks
          echo "storeFile=keystore/release.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEYSTORE_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> keystore.properties

      - name: Decode RuStore signing keystore (isolated identity)
        if: env.RUSTORE_JKS_BASE64 != ''
        env:
          RUSTORE_JKS_BASE64: ${{ secrets.RUSTORE_JKS_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$RUSTORE_JKS_BASE64" | base64 -d > keystore/rustore.jks
          echo "storeFile=keystore/rustore.jks" > rustore-keystore.properties
          echo "storePassword=${{ secrets.RUSTORE_STORE_PASSWORD }}" >> rustore-keystore.properties
          echo "keyAlias=${{ secrets.RUSTORE_KEY_ALIAS }}" >> rustore-keystore.properties
          echo "keyPassword=${{ secrets.RUSTORE_KEY_PASSWORD }}" >> rustore-keystore.properties

      - name: Build signed release APK
        run: ./gradlew :app:assembleFdroidRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/fdroid/release/app-fdroid-release.apk \
             app/build/outputs/apk/fdroid/release/adb-captain-${{ steps.ver.outputs.tag }}.apk

      - name: Build RuStore release APK
        run: ./gradlew :app:assembleRustoreRelease

      - name: Rename RuStore APK
        run: |
          mv app/build/outputs/apk/rustore/release/app-rustore-release.apk \
             app/build/outputs/apk/rustore/release/adb-captain-rustore-${{ steps.ver.outputs.tag }}.apk

      - name: Inspect APKs
        run: |
          AAPT2="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          for apk in app/build/outputs/apk/*/release/adb-captain-*.apk; do
            echo "== $apk =="
            "$AAPT2" dump badging "$apk" | grep -E "^(package|application-label-|sdkVersion|targetSdkVersion):" || true
            sha256sum "$apk"
          done

      - name: Compose release notes
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          en="fastlane/metadata/android/en-US/changelogs/${code}.txt"
          ru="fastlane/metadata/android/ru-RU/changelogs/${code}.txt"

          {
            echo "**ADB Captain** — rootless ADB toolkit powered by Shizuku."
            echo
            if [ -f "$en" ]; then
              echo "## What's new"
              echo
              tail -n +2 "$en"
              echo
            fi
            if [ -f "$ru" ]; then
              echo "## Что нового"
              echo
              tail -n +2 "$ru"
              echo
            fi

            echo "## Downloads"
            echo
            echo "| File | Size | SHA-256 |"
            echo "| --- | --- | --- |"
            for apk in app/build/outputs/apk/*/release/adb-captain-*.apk; do
              echo "| \`$(basename "$apk")\` | $(du -h "$apk" | cut -f1) | \`$(sha256sum "$apk" | cut -d' ' -f1)\` |"
            done
            echo
            echo "- \`adb-captain-${TAG}.apk\` is the F-Droid build (\`adb.captain\`), signed with the project release key."
            echo "- \`adb-captain-rustore-${TAG}.apk\` is the RuStore build (\`adb.captain.rustore\`), Russian by default. It has a separate signature, so both APKs can be installed side by side."
            echo
            echo "## Build"
            echo
            echo "- versionName \`${VERSION}\`, versionCode \`${code}\`"
            echo "- Commit \`${GITHUB_SHA}\`"
            echo "- AGPL-3.0-or-later. No ads, no analytics, no accounts, no billing."
            echo "- Reproducible: this tag is rebuilt a second time in CI and compared byte for byte against the APK attached here."
          } > release-notes.md

          head -30 release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ADB Captain ${{ steps.ver.outputs.tag }}
          draft: false
          overwrite_files: true
          body_path: release-notes.md
          files: app/build/outputs/apk/*/release/adb-captain-*.apk

      - name: Sync title and notes on the existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" \
            --title "ADB Captain $TAG" \
            --notes-file release-notes.md
