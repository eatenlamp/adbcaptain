name: Reproducibility check

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to verify (defaults to the ref name)"
        required: false
        default: ""

permissions:
  # write is required to read draft release assets via the REST API
  # (the release is held as a draft until this gate passes).
  contents: write

concurrency:
  group: repro-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  TARGET_TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_TAG }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDK_MGR=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDK_MGR" --licenses || true
          "$SDK_MGR" --install "platforms;android-37.0" "platforms;android-37.1" "build-tools;37.0.0" "platform-tools"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Grant gradlew permissions
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.jks
          echo "storeFile=keystore/release.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEYSTORE_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> keystore.properties

      - name: Build signed release APK
        run: ./gradlew :app:assembleFdroidRelease

      - name: Wait for release asset
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="adb-captain-${TARGET_TAG}.apk"
          for i in $(seq 1 60); do
            id=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TARGET_TAG}\") | .assets[]? | select(.name == \"${name}\") | .id" \
              2>/dev/null | head -1 || true)
            if [ -n "$id" ]; then
              echo "Asset $name present (id=$id) after ~$((i * 15))s"
              echo "id=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Release asset $name missing after 15 minutes"
          exit 1

      - name: Compare rebuilt with release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${{ steps.asset.outputs.id }}" > published.apk
          rebuilt="app/build/outputs/apk/fdroid/release/app-fdroid-release.apk"
          echo "release  sha256: $(sha256sum published.apk | cut -d' ' -f1)"
          echo "rebuilt  sha256: $(sha256sum "$rebuilt" | cut -d' ' -f1)"
          if cmp -s published.apk "$rebuilt"; then
            echo "OK: release APK is reproducible (byte-identical to this rebuild)"
            echo "byte-identity gate PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Rebuilt APK differs from the release asset - reproducibility broken!"
            echo "byte-identity gate FAILED" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
