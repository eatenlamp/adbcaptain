# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Tuned for an 8 GB machine where the IDE, Firefox and OneDrive also
# need room. The Gradle daemon, the Kotlin daemon and KSP all sit in RAM
# at once and stay resident between builds. Raise these only on 16 GB+.
#
# The daemon used to keep ~1.3 GB of old-gen garbage after a build and
# never gave it back: ParallelGC grows the heap eagerly and does not
# shrink it. SerialGC is cheaper here, and the MaxHeapFreeRatio pair
# makes the JVM return uncommitted pages to the OS once a build ends.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=25 -Dfile.encoding=UTF-8

# Compile Kotlin inside the Gradle daemon instead of forking a second JVM.
# The Kotlin daemon stayed resident after every build and held ~800 MB on
# an 8 GB machine; folding it into the daemon Gradle already keeps removes
# that entirely. Tradeoff: Kotlin compilation can no longer run in
# parallel with other work, which lengthens a clean build a little.
kotlin.compiler.execution.strategy=in-process

# MinHeapFreeRatio must be set together with MaxHeapFreeRatio: the Kotlin
# daemon ships a default of 40/70 and refuses to start on a mismatch.
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=25

# KSP/Hilt spawn extra workers on top of the daemons above.
ksp.daemon.jvmargs=-Xmx768m -XX:+UseSerialGC

# Drop the daemons after a few idle minutes so an 8 GB machine gets the
# RAM back between builds instead of holding it all day.
org.gradle.daemon.idletimeout=600000

# 6 cores: leave a couple free for the IDE and the OS so the machine
# does not start swapping during a build.
org.gradle.workers.max=3

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true

# Enable Gradle build caching to speed up repeat builds.
org.gradle.caching=true

# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# AGP 9.0 Compatibility
android.newDsl=false
android.builtInKotlin=false

# KSP Compatibility
ksp.useKSP2=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.overridePathCheck=true

