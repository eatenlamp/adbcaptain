# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Tuned for a 16 GB machine where the IDE, Firefox and OneDrive also
# need room. The Gradle daemon, the Kotlin daemon and KSP all sit in RAM
# at once and stay resident between builds. Raise these only on 32 GB+.
#
# ParallelGC is the fastest collector for build workloads: throughput
# matters here, pause times do not. The MaxHeapFreeRatio pair keeps it
# from squatting on RAM after a build ends - the heap may grow eagerly,
# but uncommitted pages go back to the OS once the work is done.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=25 -Dfile.encoding=UTF-8

# Compile Kotlin in its own daemon so it can overlap with Java, KSP and
# resource tasks. Folding it into the Gradle daemon (in-process) saved
# ~800 MB on an 8 GB machine but serialized the whole build; on 16 GB the
# extra daemon is the better trade.
kotlin.compiler.execution.strategy=daemon

# MinHeapFreeRatio must be set together with MaxHeapFreeRatio: the Kotlin
# daemon ships a default of 40/70 and refuses to start on a mismatch.
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=25

# KSP/Hilt spawn extra workers on top of the daemons above.
ksp.daemon.jvmargs=-Xmx1g -XX:+UseParallelGC

# Keep the daemons warm across short breaks so the next build does not
# pay the JVM startup and re-warm cost again. 16 GB has room for it.
org.gradle.daemon.idletimeout=1800000

# 6 physical threads (Ryzen 5 3500X has no SMT): leave two for the IDE
# and the OS so the machine does not start swapping during a build.
org.gradle.workers.max=4

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true

# Enable Gradle build caching to speed up repeat builds.
org.gradle.caching=true

# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# AGP 9.0 Compatibility
android.newDsl=false
android.builtInKotlin=false

# KSP Compatibility
ksp.useKSP2=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.overridePathCheck=true

