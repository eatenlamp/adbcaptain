# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Tuned for an 8 GB machine where the IDE, Firefox and OneDrive also
# need room: the Gradle daemon, the Kotlin daemon and KSP all sit in
# RAM at once and stay resident between builds. Raise these only on 16 GB+.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# The Kotlin compile daemon is a separate JVM. Without an explicit cap
# it inherits a default that can grab a gigabyte on its own.
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m

# KSP/Hilt spawn extra workers on top of the daemons above.
ksp.daemon.jvmargs=-Xmx768m

# 6 cores: leave a couple free for the IDE and the OS so the machine
# does not start swapping during a build.
org.gradle.workers.max=3

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true

# Enable Gradle build caching to speed up repeat builds.
org.gradle.caching=true

# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# AGP 9.0 Compatibility
android.newDsl=false
android.builtInKotlin=false

# KSP Compatibility
ksp.useKSP2=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.overridePathCheck=true
